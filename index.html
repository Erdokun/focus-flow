<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>StudyTimer — Deep Focus & Time-boxing</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #090a10;
      color: #f8fafc;
      padding: 24px 16px;
      overflow-x: hidden;
      position: relative;
    }

    /* Ambient animated mesh glowing orbs */
    .ambient-bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      overflow: hidden;
      pointer-events: none;
    }

    .ambient-orb {
      position: absolute;
      border-radius: 50%;
      filter: blur(110px);
      opacity: 0.45;
      animation: floatGlow 20s infinite alternate ease-in-out;
    }

    .orb-purple {
      width: 520px;
      height: 520px;
      background: radial-gradient(circle, #6366f1 0%, rgba(99, 102, 241, 0) 70%);
      top: -140px;
      left: 15%;
      animation-duration: 22s;
    }

    .orb-blue {
      width: 460px;
      height: 460px;
      background: radial-gradient(circle, #3b82f6 0%, rgba(59, 130, 246, 0) 70%);
      bottom: -120px;
      right: 15%;
      animation-duration: 26s;
      animation-delay: -6s;
    }

    .orb-indigo {
      width: 380px;
      height: 380px;
      background: radial-gradient(circle, #8b5cf6 0%, rgba(139, 92, 246, 0) 70%);
      top: 35%;
      right: 30%;
      opacity: 0.28;
      animation-duration: 18s;
      animation-delay: -11s;
    }

    @keyframes floatGlow {
      0% { transform: translate(0, 0) scale(1); }
      50% { transform: translate(60px, 45px) scale(1.1); }
      100% { transform: translate(-45px, 75px) scale(0.95); }
    }

    /* Subtle background grid pattern */
    .grid-overlay {
      position: fixed;
      inset: 0;
      background-image: radial-gradient(rgba(255, 255, 255, 0.08) 1px, transparent 1px);
      background-size: 32px 32px;
      opacity: 0.35;
      pointer-events: none;
      z-index: 1;
    }

    /* Main Application Card */
    .app-card {
      position: relative;
      z-index: 10;
      background: rgba(18, 20, 29, 0.78);
      border: 1px solid rgba(255, 255, 255, 0.1);
      backdrop-filter: blur(28px);
      -webkit-backdrop-filter: blur(28px);
      width: 100%;
      max-width: 490px;
      padding: 44px 38px;
      border-radius: 32px;
      box-shadow: 
        0 30px 70px -15px rgba(0, 0, 0, 0.8),
        0 0 50px rgba(99, 102, 241, 0.12),
        inset 0 1px 1px rgba(255, 255, 255, 0.12);
      text-align: center;
      transition: all 0.3s ease;
    }

    /* Header Bar */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 28px;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .brand-icon {
      width: 36px;
      height: 36px;
      border-radius: 12px;
      background: linear-gradient(135deg, #6366f1 0%, #4338ca 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
    }

    .brand-icon svg {
      width: 20px;
      height: 20px;
      fill: #ffffff;
    }

    .brand-name {
      font-size: 21px;
      font-weight: 700;
      letter-spacing: -0.6px;
      color: #ffffff;
    }

    .streak-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 600;
      color: #fcd34d;
      background: rgba(251, 191, 36, 0.1);
      padding: 6px 14px;
      border-radius: 999px;
      border: 1px solid rgba(251, 191, 36, 0.24);
      transition: transform 0.2s ease;
    }

    .streak-badge:hover {
      transform: scale(1.04);
    }

    /* Mode Navigation Tabs */
    .mode-tabs {
      display: flex;
      background: rgba(255, 255, 255, 0.04);
      padding: 5px;
      border-radius: 18px;
      margin-bottom: 26px;
      border: 1px solid rgba(255, 255, 255, 0.07);
    }

    .mode-btn {
      flex: 1;
      padding: 11px 8px;
      border: none;
      background: transparent;
      color: #94a3b8;
      font-size: 13.5px;
      font-weight: 600;
      border-radius: 14px;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .mode-btn:hover {
      color: #f1f5f9;
    }

    .mode-btn.active {
      background: #6366f1;
      color: #ffffff;
      box-shadow: 0 4px 16px rgba(99, 102, 241, 0.45);
    }

    /* Active Task Input */
    .task-wrapper {
      margin-bottom: 28px;
      position: relative;
    }

    .task-input {
      width: 100%;
      background: rgba(11, 13, 20, 0.65);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 16px;
      padding: 13px 18px;
      color: #f8fafc;
      font-size: 14.5px;
      font-weight: 500;
      outline: none;
      transition: all 0.25s ease;
      text-align: center;
    }

    .task-input:focus {
      border-color: #818cf8;
      background: rgba(15, 18, 28, 0.85);
      box-shadow: 0 0 0 4px rgba(129, 140, 248, 0.18);
    }

    .task-input::placeholder {
      color: #64748b;
      font-size: 14px;
      font-weight: 400;
    }

    /* Circular Progress Display */
    .timer-container {
      position: relative;
      width: 270px;
      height: 270px;
      margin: 0 auto 30px auto;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .timer-svg {
      transform: rotate(-90deg);
      width: 100%;
      height: 100%;
    }

    .timer-circle-bg {
      fill: none;
      stroke: rgba(255, 255, 255, 0.05);
      stroke-width: 9;
    }

    .timer-circle-progress {
      fill: none;
      stroke: #6366f1;
      stroke-width: 9;
      stroke-linecap: round;
      stroke-dasharray: 753.98;
      stroke-dashoffset: 0;
      transition: stroke-dashoffset 0.8s linear, stroke 0.3s ease;
      filter: drop-shadow(0 0 10px rgba(99, 102, 241, 0.45));
    }

    .timer-inner-content {
      position: absolute;
      display: flex;
      flex-direction: column;
      align-items: center;
      pointer-events: none;
    }

    /* CRITICAL: Clean, hollow geometric digits without any inner dot */
    .time-digits {
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 60px;
      font-weight: 800;
      letter-spacing: -2px;
      font-variant-numeric: tabular-nums;
      font-feature-settings: "zero" 0;
      color: #ffffff;
      text-shadow: 0 0 24px rgba(99, 102, 241, 0.4);
      line-height: 1;
    }

    .timer-label {
      font-size: 13px;
      color: #94a3b8;
      margin-top: 10px;
      font-weight: 500;
      letter-spacing: 0.2px;
      max-width: 200px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Control Buttons */
    .controls {
      display: flex;
      gap: 14px;
      margin-bottom: 22px;
    }

    .btn {
      flex: 1;
      padding: 15px 0;
      border-radius: 16px;
      font-size: 15px;
      font-weight: 700;
      border: none;
      cursor: pointer;
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    .btn-main {
      background: linear-gradient(135deg, #6366f1 0%, #4f46e5 100%);
      color: #ffffff;
      box-shadow: 0 8px 24px -4px rgba(99, 102, 241, 0.5);
    }

    .btn-main:hover {
      background: linear-gradient(135deg, #4f46e5 0%, #4338ca 100%);
      transform: translateY(-2px);
      box-shadow: 0 12px 28px -4px rgba(99, 102, 241, 0.65);
    }

    .btn-alt {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #cbd5e1;
    }

    .btn-alt:hover {
      background: rgba(255, 255, 255, 0.1);
      color: #ffffff;
      transform: translateY(-2px);
    }

    .btn:active {
      transform: translateY(0);
    }

    /* Quick Adjustment Bar */
    .quick-bar {
      display: flex;
      justify-content: center;
      gap: 10px;
      margin-bottom: 20px;
    }

    .quick-chip {
      padding: 7px 15px;
      font-size: 12px;
      font-weight: 600;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8;
      border-radius: 10px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .quick-chip:hover {
      background: rgba(255, 255, 255, 0.09);
      color: #f1f5f9;
      border-color: rgba(255, 255, 255, 0.15);
      transform: translateY(-1px);
    }

    .footer-hint {
      font-size: 12px;
      color: #64748b;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .kbd {
      background: rgba(255, 255, 255, 0.08);
      padding: 2px 7px;
      border-radius: 6px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 700;
      color: #94a3b8;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
  </style>
</head>
<body>

  <!-- Floating animated gradient orbs -->
  <div class="ambient-bg">
    <div class="ambient-orb orb-purple"></div>
    <div class="ambient-orb orb-blue"></div>
    <div class="ambient-orb orb-indigo"></div>
  </div>
  <div class="grid-overlay"></div>

  <!-- Main Focus Container -->
  <main class="app-card">
    <header class="top-bar">
      <div class="brand">
        <div class="brand-icon">
          <svg viewBox="0 0 24 24"><path d="M12 2C6.48 2 2 6.48 2 12s4.48 10 10 10 10-4.48 10-10S17.52 2 12 2zm0 18c-4.42 0-8-3.58-8-8s3.58-8 8-8 8 3.58 8 8-3.58 8-8 8zm.5-13H11v6l5.25 3.15.75-1.23-4.5-2.67z"/></svg>
        </div>
        <span class="brand-name">StudyTimer</span>
      </div>
      <div id="streakDisplay" class="streak-badge">
        <span>⚡</span> <span id="streakCount">0 Sessions</span>
      </div>
    </header>

    <!-- Mode Selector -->
    <nav class="mode-tabs" aria-label="Timer Modes">
      <button class="mode-btn active" data-mode="focus" data-time="1500">Focus (25m)</button>
      <button class="mode-btn" data-mode="short" data-time="300">Short Break (5m)</button>
      <button class="mode-btn" data-mode="long" data-time="900">Long Break (15m)</button>
    </nav>

    <!-- Active Single Task Anchor -->
    <div class="task-wrapper">
      <input type="text" id="taskInput" class="task-input" placeholder="🎯 What are you focusing on right now?" maxlength="50" autocomplete="off">
    </div>

    <!-- Radial Progress Ring -->
    <div class="timer-container">
      <svg class="timer-svg" viewBox="0 0 260 260">
        <circle class="timer-circle-bg" cx="130" cy="130" r="120"></circle>
        <circle id="progressCircle" class="timer-circle-progress" cx="130" cy="130" r="120"></circle>
      </svg>
      <div class="timer-inner-content">
        <div id="timeDisplay" class="time-digits">25:00</div>
        <div id="statusLabel" class="timer-label">Ready to Focus</div>
      </div>
    </div>

    <!-- Controls -->
    <div class="controls">
      <button id="toggleBtn" class="btn btn-main">Start Session</button>
      <button id="resetBtn" class="btn btn-alt">Reset</button>
    </div>

    <!-- Quick Add Adjusters -->
    <div class="quick-bar">
      <button class="quick-chip" id="addFive">+5 Mins</button>
      <button class="quick-chip" id="addTen">+10 Mins</button>
      <button class="quick-chip" id="soundTest">🔔 Sound Check</button>
    </div>

    <footer class="footer-hint">
      Shortcut: Press <span class="kbd">Space</span> to start/pause • <span class="kbd">R</span> to reset
    </footer>
  </main>

  <script>
    // Clean audio synthesis chime (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playChime() {
      try {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(587.33, now); // D5 note
        osc.frequency.exponentialRampToValueAtTime(880.00, now + 0.35); // A5 note
        gain.gain.setValueAtTime(0.35, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 1.4);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 1.4);
      } catch (e) {
        console.warn('Audio chime error:', e);
      }
    }

    // State Variables
    let currentMode = 'focus';
    let totalTime = 25 * 60;
    let timeLeft = totalTime;
    let timerId = null;
    let sessionsCompleted = 0;

    const RADIUS = 120;
    const CIRCUMFERENCE = 2 * Math.PI * RADIUS; // ~753.98

    // Elements
    const timeDisplay = document.getElementById('timeDisplay');
    const statusLabel = document.getElementById('statusLabel');
    const toggleBtn = document.getElementById('toggleBtn');
    const resetBtn = document.getElementById('resetBtn');
    const progressCircle = document.getElementById('progressCircle');
    const modeBtns = document.querySelectorAll('.mode-btn');
    const streakCount = document.getElementById('streakCount');
    const taskInput = document.getElementById('taskInput');
    const addFiveBtn = document.getElementById('addFive');
    const addTenBtn = document.getElementById('addTen');
    const soundTestBtn = document.getElementById('soundTest');

    progressCircle.style.strokeDasharray = CIRCUMFERENCE;

    function setCircleProgress(fraction) {
      const offset = CIRCUMFERENCE * (1 - fraction);
      progressCircle.style.strokeDashoffset = offset;
    }

    function updateDisplay() {
      const minutes = Math.floor(timeLeft / 60);
      const seconds = timeLeft % 60;
      const formatted = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
      timeDisplay.textContent = formatted;
      document.title = `(${formatted}) StudyTimer`;

      const progress = totalTime > 0 ? (timeLeft / totalTime) : 0;
      setCircleProgress(progress);
    }

    function startTimer() {
      if (timerId !== null) return;
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const activeTask = taskInput.value.trim();
      statusLabel.textContent = activeTask ? `Focusing: ${activeTask}` : (currentMode === 'focus' ? 'Deep Focus Session' : 'Recharging...');
      toggleBtn.textContent = 'Pause';
      toggleBtn.classList.remove('btn-main');
      toggleBtn.classList.add('btn-alt');

      timerId = setInterval(() => {
        if (timeLeft > 0) {
          timeLeft--;
          updateDisplay();
        } else {
          clearInterval(timerId);
          timerId = null;
          handleSessionCompletion();
        }
      }, 1000);
    }

    function pauseTimer() {
      clearInterval(timerId);
      timerId = null;
      statusLabel.textContent = 'Session Paused';
      toggleBtn.textContent = 'Resume';
      toggleBtn.classList.remove('btn-alt');
      toggleBtn.classList.add('btn-main');
    }

    function resetTimer() {
      clearInterval(timerId);
      timerId = null;
      timeLeft = totalTime;
      updateDisplay();
      statusLabel.textContent = currentMode === 'focus' ? 'Ready to Focus' : 'Ready for Break';
      toggleBtn.textContent = 'Start Session';
      toggleBtn.classList.remove('btn-alt');
      toggleBtn.classList.add('btn-main');
    }

    function handleSessionCompletion() {
      playChime();
      if (currentMode === 'focus') {
        sessionsCompleted++;
        streakCount.textContent = `${sessionsCompleted} ${sessionsCompleted === 1 ? 'Session' : 'Sessions'}`;
        statusLabel.textContent = '🎉 Great job! Time for a break.';
      } else {
        statusLabel.textContent = 'Break finished! Back to focus.';
      }
      toggleBtn.textContent = 'Start Next';
      toggleBtn.classList.remove('btn-alt');
      toggleBtn.classList.add('btn-main');
      setCircleProgress(0);
    }

    // Event Listeners
    toggleBtn.addEventListener('click', () => {
      if (timerId === null) {
        startTimer();
      } else {
        pauseTimer();
      }
    });

    resetBtn.addEventListener('click', resetTimer);

    modeBtns.forEach(btn => {
      btn.addEventListener('click', () => {
        modeBtns.forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        currentMode = btn.dataset.mode;
        totalTime = parseInt(btn.dataset.time, 10);
        
        // Mode color theme switches
        if (currentMode === 'focus') {
          progressCircle.style.stroke = '#6366f1';
          progressCircle.style.filter = 'drop-shadow(0 0 10px rgba(99, 102, 241, 0.45))';
        } else if (currentMode === 'short') {
          progressCircle.style.stroke = '#10b981';
          progressCircle.style.filter = 'drop-shadow(0 0 10px rgba(16, 185, 129, 0.45))';
        } else {
          progressCircle.style.stroke = '#3b82f6';
          progressCircle.style.filter = 'drop-shadow(0 0 10px rgba(59, 130, 246, 0.45))';
        }

        resetTimer();
      });
    });

    addFiveBtn.addEventListener('click', () => {
      timeLeft += 5 * 60;
      totalTime += 5 * 60;
      updateDisplay();
    });

    addTenBtn.addEventListener('click', () => {
      timeLeft += 10 * 60;
      totalTime += 10 * 60;
      updateDisplay();
    });

    soundTestBtn.addEventListener('click', playChime);

    // Keyboard Shortcuts
    window.addEventListener('keydown', (e) => {
      if (e.target.tagName === 'INPUT') return;
      if (e.code === 'Space') {
        e.preventDefault();
        toggleBtn.click();
      } else if (e.code === 'KeyR') {
        resetTimer();
      }
    });

    // Initialize display on load
    updateDisplay();
  </script>
</body>
</html>
